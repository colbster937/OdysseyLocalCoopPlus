# Odyssey Local Co-op release settings
#
# This LayeredFS file is read at every StageScene initialization. Edit the
# installed copy while Ryujinx is closed, or enter a different stage after an
# edit to reload it. The mod never writes this file.

# Standard co-op zoom at zero/near separation. 1.00 = Odyssey's native camera.
camera.zoom.base=1.12

# Dynamic zoom ceiling reached at camera.zoom.separation_full.
camera.zoom.max=1.65

# Horizontal P1/P2 separation where dynamic zoom starts and reaches maximum.
camera.zoom.separation_start=500
camera.zoom.separation_full=2500

# Per-frame smoothing toward the requested zoom. Valid range: 0.001 through 1.0.
camera.zoom.lerp=0.05

# Default co-op player count, 2 to 4. The pause-menu co-op action offers
# 2/3/4 players; that choice overrides this default until the game exits.
# Each player needs its own controller
# (in Ryujinx: a separate device or key layout per player). If fewer
# controllers are connected, the count drops to match.
player.count=2

# Extra players come out of the stage's entrance door/pipe one after another,
# replaying its exit animation. Set to 0 to have them appear next to P1.
player.staggered_entrance=1

# Costume archive names present in Odyssey 1.0.0. Empty values inherit P1.
player.p2.body=MarioColorLuigi
player.p2.cap=MarioColorLuigi
player.p3.body=MarioColorWario
player.p3.cap=MarioColorWario
player.p4.body=MarioColorWaluigi
player.p4.cap=MarioColorWaluigi

# How far to P1's side P2 spawns, in game units (about 100 = one Mario width).
# 0 spawns P2 on top of P1. Negative values use P1's other side.
# P3 spawns the same distance on P1's other side, P4 twice as far as P2.
player.p2.spawn_offset=120

# Delay after a player's native death animation before recovery-bubble return.
respawn.delay_seconds=10

# Out-of-view recovery distance, hold time, and per-player cooldown.
bubble.distance=3000
bubble.hold_seconds=1.5
bubble.cooldown_seconds=10

# Treat a captured actor that is currently in water as a safe recovery
# destination, equivalent to standing on ground. Set to 0 to require ground.
bubble.water_counts_as_ground=1

# Optional scoreboard-only competitions. The HUD archive is included in the
# release, so either mode can be enabled without preparing any extra assets.
# They remain off by default because some scoring paths are still incomplete.
competition.coin.enabled=0
competition.coin.target=10
competition.moon.enabled=0
competition.moon.target=3

# Reserved scoreboard offset settings.
competition.hud_x=0
competition.hud_y=0
